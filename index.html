<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aufgaben">
<meta name="theme-color" content="#1e1b4b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Meine Aufgaben</title>
<style>
:root {
  --bg: #f4f3ff; --ink: #1b1b3a; --muted: #6b6b8d; --line: #e7e6f7;
  --a1: #6d5dfc; --a2: #a855f7; --a3: #ec4899;
  --rot: #ef4444; --orange: #f59e0b; --gruen: #10b981; --blau: #3b82f6;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; min-height: 100vh; color: var(--ink); background-color: var(--bg);
  font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  background-image: radial-gradient(900px 500px at 8% -10%, #e0d9ff 0, transparent 60%),
                    radial-gradient(800px 500px at 100% 0, #ffd9ec 0, transparent 55%);
  background-attachment: fixed;
}
button, input, select, textarea { font-family: inherit; font-size: 14px; color: inherit; }
button { cursor: pointer; }
.seite { max-width: 1180px; margin: 0 auto; padding: 20px 20px 90px; }

/* ---------- Kopfbereich ---------- */
.hero {
  position: relative; overflow: hidden; border-radius: 28px; padding: 28px; color: #fff;
  background: linear-gradient(120deg, #1e1b4b 0%, #4338ca 45%, #9333ea 75%, #db2777 100%);
  box-shadow: 0 24px 50px -22px rgba(67, 56, 202, .7);
}
.blob { position: absolute; border-radius: 50%; filter: blur(42px); opacity: .5; animation: schweben 12s ease-in-out infinite alternate; }
.b1 { width: 260px; height: 260px; background: #22d3ee; top: -90px; right: 12%; }
.b2 { width: 230px; height: 230px; background: #f472b6; bottom: -100px; left: 30%; animation-delay: -4s; }
.b3 { width: 180px; height: 180px; background: #facc15; top: 30%; right: -60px; animation-delay: -8s; opacity: .3; }
@keyframes schweben { to { transform: translate(40px, 30px) scale(1.15); } }
.hero > *:not(.blob) { position: relative; z-index: 1; }
.hero-oben { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
.klein { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; opacity: .8; font-weight: 600; }
.hero h1 { margin: 4px 0 4px; font-size: 34px; line-height: 1.1; letter-spacing: -.02em; }
.sub { opacity: .9; font-size: 15px; }
.ring { position: relative; width: 96px; height: 96px; flex: none; }
.ring svg { width: 96px; height: 96px; transform: rotate(-90deg); }
.ring .bg { stroke: rgba(255,255,255,.22); }
.ring .fg { stroke: url(#ringverlauf); transition: stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1); }
.ring .mitte { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.05; }
.ring .mitte b { font-size: 22px; }
.ring .mitte span { font-size: 10px; opacity: .85; text-transform: uppercase; letter-spacing: .05em; }
.kacheln { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 22px; }
.kachel {
  text-align: left; padding: 14px 16px; border-radius: 18px; border: 1px solid rgba(255,255,255,.28);
  background: rgba(255,255,255,.13); backdrop-filter: blur(10px); color: #fff;
  transition: transform .18s, background .18s, box-shadow .18s; position: relative; overflow: hidden;
}
.kachel:hover { transform: translateY(-3px); background: rgba(255,255,255,.22); }
.kachel.an { box-shadow: 0 0 0 3px rgba(255,255,255,.7); }
.kachel .zahl { display: block; font-size: 36px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
.kachel .lbl { display: block; margin-top: 6px; font-size: 13px; opacity: .9; }
.kachel::after { content: ""; position: absolute; right: -18px; top: -18px; width: 64px; height: 64px; border-radius: 50%; background: var(--farbe, #fff); opacity: .55; filter: blur(6px); }
.k-ueber { --farbe: #f87171; } .k-heute { --farbe: #fbbf24; } .k-woche { --farbe: #22d3ee; } .k-ohne { --farbe: #c4b5fd; }
.kachel.leuchtet { background: rgba(248,113,113,.35); border-color: rgba(254,202,202,.7); }
.hero-unten { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 18px; }
.pille { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.25); }
.pille.ok::before, .pille.warn::before, .pille.schlecht::before { content: ""; width: 8px; height: 8px; border-radius: 50%; }
.pille.ok::before { background: #34d399; } .pille.warn::before { background: #fbbf24; } .pille.schlecht::before { background: #f87171; }
.hero-unten .rechts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.hbtn { padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #fff; font-weight: 600; transition: background .15s, transform .15s; }
.hbtn:hover { background: rgba(255,255,255,.25); transform: translateY(-1px); }
.hbtn.voll { background: #fff; color: #4338ca; border-color: #fff; }
.hbtn.voll:hover { background: #f1efff; }

/* ---------- Erfassen ---------- */
.erfassen {
  display: flex; align-items: center; gap: 10px; margin: -22px 18px 0; position: relative; z-index: 2;
  background: #fff; border-radius: 20px; padding: 8px 8px 8px 18px; border: 1px solid var(--line);
  box-shadow: 0 16px 40px -18px rgba(67,56,202,.45); transition: box-shadow .2s;
}
.erfassen:focus-within { box-shadow: 0 0 0 3px rgba(109,93,252,.35), 0 16px 40px -18px rgba(67,56,202,.5); }
.erfassen .plus { font-size: 26px; line-height: 1; color: var(--a1); font-weight: 300; }
.erfassen input { flex: 1; border: 0; outline: 0; font-size: 17px; padding: 12px 4px; background: transparent; min-width: 0; }
.senden { padding: 12px 20px; border: 0; border-radius: 14px; color: #fff; font-weight: 700; background: linear-gradient(120deg, var(--a1), var(--a2), var(--a3)); transition: transform .15s, filter .15s; }
.senden:hover { transform: translateY(-1px); filter: brightness(1.08); }
.vorschau { margin: 8px 24px 0; min-height: 26px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.vorschau .tipp { opacity: .85; }
.vorschau .titelvor { font-weight: 600; color: var(--ink); margin-right: 4px; }

/* ---------- Reiter und Filter ---------- */
.tabs { display: flex; gap: 6px; padding: 5px; background: rgba(255,255,255,.7); border: 1px solid var(--line); border-radius: 999px; width: fit-content; max-width: 100%; overflow-x: auto; margin: 12px 0 14px; backdrop-filter: blur(8px); }
.tab { border: 0; background: transparent; padding: 9px 18px; border-radius: 999px; font-weight: 600; color: var(--muted); white-space: nowrap; transition: all .2s; }
.tab:hover { color: var(--ink); background: rgba(109,93,252,.08); }
.tab.an { color: #fff; background: linear-gradient(120deg, var(--a1), var(--a2)); box-shadow: 0 8px 18px -8px rgba(109,93,252,.9); }
.tab .zaehler { display: inline-block; margin-left: 6px; min-width: 20px; padding: 1px 6px; border-radius: 999px; font-size: 12px; background: rgba(109,93,252,.14); color: var(--a1); }
.tab.an .zaehler { background: rgba(255,255,255,.28); color: #fff; }
.filter { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.filter label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
select, input[type=text], input[type=date], textarea { padding: 8px 10px; border: 1px solid #d6d4ee; border-radius: 10px; background: #fff; outline: none; }
select:focus, input:focus, textarea:focus { border-color: var(--a1); box-shadow: 0 0 0 3px rgba(109,93,252,.2); }
.fchip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; border: 1px solid #d6d4ee; background: #fff; font-weight: 600; color: var(--muted); transition: all .15s; }
.fchip svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
.fchip:hover { border-color: var(--a1); color: var(--a1); }
.fchip.an { background: var(--a1); border-color: var(--a1); color: #fff; }
.fchip.an svg { fill: currentColor; }

/* ---------- Gruppen und Karten ---------- */
.gruppe { display: flex; align-items: center; gap: 10px; margin: 22px 4px 10px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.gruppe .punkt { width: 10px; height: 10px; border-radius: 50%; background: var(--c, #a5a3d6); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c, #a5a3d6) 25%, transparent); }
.gruppe .n { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: #fff; border: 1px solid var(--line); letter-spacing: 0; }
.g-ueber { --c: var(--rot); color: #b91c1c; } .g-heute { --c: var(--orange); color: #b45309; }
.g-woche { --c: #06b6d4; } .g-spaeter { --c: var(--blau); } .g-ohne { --c: #a5a3d6; } .g-fertig { --c: var(--gruen); } .g-liegen { --c: var(--a2); color: #7e22ce; } .g-plan { --c: var(--a1); }

.karte {
  position: relative; overflow: hidden; background: #fff; border: 1px solid var(--line); border-radius: 18px; margin-bottom: 10px;
  box-shadow: 0 1px 2px rgba(30,27,75,.04), 0 10px 26px -14px rgba(30,27,75,.22);
  transition: transform .18s, box-shadow .18s, opacity .35s;
}
.karte:hover { transform: translateY(-2px); box-shadow: 0 1px 2px rgba(30,27,75,.05), 0 16px 32px -14px rgba(30,27,75,.3); }
.karte::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: #dcdaf3; }
.karte.ueberfaellig::before { background: linear-gradient(#ef4444, #f97316); }
.karte.ueberfaellig { background: linear-gradient(90deg, #fff1f1, #fff 40%); }
.karte.heute::before { background: linear-gradient(#f59e0b, #fbbf24); }
.karte.heute { background: linear-gradient(90deg, #fff8e6, #fff 40%); }
.karte.liegen::before { background: linear-gradient(#a855f7, #ec4899); }
.karte.erledigt { opacity: .6; }
.karte.erledigt .titel { text-decoration: line-through; color: var(--muted); }
.karte.abgehakt { opacity: 0; transform: translateX(24px) scale(.98); }
.karte.neu { animation: aufblitzen 1.4s ease-out; }
@keyframes aufblitzen { 0% { box-shadow: 0 0 0 0 rgba(109,93,252,.7); } 100% { box-shadow: 0 0 0 16px rgba(109,93,252,0); } }
.anim .karte { animation: rein .45s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 40ms); }
@keyframes rein { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.kopf { display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 20px; flex-wrap: wrap; }
.haken { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #c4c1e8; background: #fff; display: grid; place-items: center; flex: none; padding: 0; color: #fff; transition: all .2s; }
.haken svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transform: scale(.5); transition: all .2s; }
.haken:hover { border-color: var(--gruen); }
.haken:hover svg { opacity: .35; transform: none; color: var(--gruen); }
.erledigt .haken, .haken.pop { background: linear-gradient(135deg, #10b981, #34d399); border-color: transparent; }
.erledigt .haken svg, .haken.pop svg { opacity: 1; transform: none; color: #fff; }
.haken.pop { animation: pop .38s; }
@keyframes pop { 50% { transform: scale(1.3); } }
.haupt { flex: 1 1 240px; min-width: 0; cursor: pointer; }
.titel { font-size: 16.5px; font-weight: 650; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chips:empty { display: none; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: #efeefb; color: #55557a; white-space: nowrap; }
.chip.rot { background: #fee2e2; color: #b91c1c; } .chip.orange { background: #fef3c7; color: #92400e; }
.chip.lila { background: #f3e8ff; color: #7e22ce; } .chip.gruen { background: #d1fae5; color: #047857; }
.chip.blau { background: #dbeafe; color: #1d4ed8; } .chip.grau { background: #f1f1f6; color: #6b6b8d; }
.chip.sofort { background: linear-gradient(120deg, #ef4444, #f97316); color: #fff; }
.chip.einplanen { background: linear-gradient(120deg, #6d5dfc, #a855f7); color: #fff; }
.chip.abgeben { background: #fef3c7; color: #92400e; }
.aktionen { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.plan { padding: 6px 11px; border-radius: 999px; border: 1px solid #d6d4ee; background: #fff; font-size: 12.5px; font-weight: 600; color: var(--muted); transition: all .15s; }
.plan:hover { border-color: var(--a1); color: var(--a1); background: #f5f3ff; }
.plan.an { background: #ede9fe; border-color: var(--a1); color: var(--a1); }
.ico { width: 34px; height: 34px; border-radius: 50%; border: 1px solid #d6d4ee; background: #fff; display: grid; place-items: center; padding: 0; color: #a3a1c8; transition: all .18s; }
.ico svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ico:hover:not(:disabled) { transform: scale(1.1); color: var(--a1); border-color: var(--a1); }
.ico:disabled { opacity: .3; cursor: default; }
.ico.an svg { fill: currentColor; }
.ico.wichtig.an { color: #fff; border-color: transparent; background: linear-gradient(135deg, #6d5dfc, #a855f7); box-shadow: 0 6px 14px -6px rgba(109,93,252,.9); }
.ico.dringend.an { color: #fff; border-color: transparent; background: linear-gradient(135deg, #f97316, #ef4444); box-shadow: 0 6px 14px -6px rgba(239,68,68,.9); }
.ico.klein svg, .ico.klein { width: 28px; height: 28px; }
.ico.klein svg { width: 15px; height: 15px; }
.details { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; padding: 6px 20px 18px 62px; border-top: 1px dashed var(--line); margin-top: 0; padding-top: 14px; }
.details label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.details .breit { flex: 1 1 100%; }
.details .breit input, .details .breit textarea { width: 100%; }
.details textarea { min-height: 70px; resize: vertical; }
.details .mit-x { display: flex; gap: 4px; align-items: center; }
.loeschen { margin-left: auto; padding: 8px 14px; border-radius: 10px; border: 1px solid #fca5a5; background: #fff; color: #b91c1c; font-weight: 600; }
.loeschen:hover { background: #fee2e2; }
.kompakt .kopf { padding: 10px 10px 10px 16px; gap: 8px; }
.kompakt .haken { width: 24px; height: 24px; }
.kompakt .haken svg { width: 14px; height: 14px; }
.kompakt .titel { font-size: 14px; }
.kompakt .haupt { flex-basis: 100%; order: 2; }
.kompakt .details { padding: 12px 14px 14px; }
.kompakt .details label { flex: 1 1 100%; }
.kompakt .loeschen { margin: 0; }

.banner { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-radius: 14px; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
.banner.warn { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
.leer { text-align: center; padding: 56px 20px; color: var(--muted); }
.leer .gross { width: 76px; height: 76px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--a1), var(--a3)); box-shadow: 0 16px 30px -12px rgba(168,85,247,.8); }
.leer .gross svg { width: 38px; height: 38px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.leer h3 { margin: 0 0 4px; color: var(--ink); font-size: 20px; }

/* ---------- Woche ---------- */
.wochenkopf { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.wochenkopf .titelw { font-size: 18px; font-weight: 700; }
.wochenkopf .datumw { color: var(--muted); font-size: 14px; }
.raster { display: grid; grid-template-columns: repeat(7, minmax(136px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 6px; align-items: start; }
.spalte { background: rgba(255,255,255,.6); border: 1px solid var(--line); border-radius: 18px; padding: 8px; min-height: 140px; }
.spalte.hier { background: linear-gradient(180deg, #ede9fe, rgba(255,255,255,.7)); border-color: #c4b5fd; }
.spalte.vorbei { opacity: .75; }
.spaltenkopf { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 8px 10px; }
.spaltenkopf b { font-size: 15px; } .spaltenkopf small { color: var(--muted); margin-left: 6px; }
.spaltenkopf .anz { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #fff; border: 1px solid var(--line); color: var(--muted); }
.spaltenkopf .anz.voll { background: #fee2e2; border-color: #fca5a5; color: #b91c1c; }
.spalte .karte { margin-bottom: 8px; border-radius: 14px; }
.spalte .karte:hover { transform: none; }
.spalte .aktionen { width: 100%; justify-content: flex-end; order: 3; }
.streifen { margin-top: 22px; }
.einplan { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; margin-bottom: 8px; }
.einplan .t { flex: 1 1 220px; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.einplan .tage { display: flex; gap: 4px; flex-wrap: wrap; }

/* ---------- Meldungen ---------- */
.toast { width: max-content; position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 30px); opacity: 0; pointer-events: none; z-index: 70; display: flex; gap: 14px; align-items: center; padding: 12px 18px; border-radius: 16px; background: #1e1b4b; color: #fff; font-weight: 600; box-shadow: 0 20px 40px -12px rgba(30,27,75,.6); transition: all .3s; max-width: 92vw; }
.toast.sicht { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { border: 0; background: rgba(255,255,255,.18); color: #fff; padding: 6px 12px; border-radius: 10px; font-weight: 700; }
.toast button:hover { background: rgba(255,255,255,.3); }
.modal { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; background: rgba(30,27,75,.5); backdrop-filter: blur(4px); padding: 16px; }
.modal.sicht { display: grid; }
.modal .box { background: #fff; border-radius: 22px; width: min(640px, 100%); max-height: 86vh; overflow: auto; padding: 24px; box-shadow: 0 30px 70px -20px rgba(30,27,75,.7); animation: rein .3s both; }
.modal h2 { margin: 0 0 12px; font-size: 21px; }
.modal table { border-collapse: collapse; width: 100%; font-size: 14px; }
.modal td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.modal td:first-child { font-weight: 600; white-space: nowrap; color: var(--a1); }
.modal .zu { float: right; border: 0; background: #efeefb; width: 34px; height: 34px; border-radius: 50%; font-size: 18px; }
.pk { display: flex; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.pk .t { flex: 1; min-width: 0; overflow-wrap: anywhere; } .pk .t small { display: block; color: var(--muted); }
.knopf { padding: 7px 12px; border-radius: 10px; border: 1px solid #d6d4ee; background: #fff; font-weight: 600; }
.knopf:hover { background: #f5f3ff; }
.knopf.rot { color: #b91c1c; border-color: #fca5a5; }

/* ---------- Suche, Unteraufgaben, Rückblick ---------- */
.leiste { display: flex; flex-wrap: wrap; gap: 0 14px; align-items: center; justify-content: space-between; }
.leiste .tabs { margin: 12px 0 14px; }
.suche { flex: 1 1 220px; max-width: 340px; margin: 12px 0 14px auto; }
.suche input { width: 100%; padding: 10px 16px; border-radius: 999px; border: 1px solid #d6d4ee; background: rgba(255,255,255,.88); -webkit-appearance: none; appearance: none; }
.banner.info { background: #ede9fe; color: #4338ca; border: 1px solid #c4b5fd; }
.banner.info .knopf { margin-left: auto; }
.chip.mandant { background: #e0f2fe; color: #0369a1; } .chip.projekt { background: #fce7f3; color: #9d174d; }
.unter { background: #faf9ff; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.unter .ukopf { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.unter .ubalken { height: 5px; border-radius: 99px; background: #e7e6f7; overflow: hidden; margin-bottom: 8px; }
.unter .ubalken i { display: block; height: 100%; background: linear-gradient(90deg, var(--a1), var(--a3)); transition: width .3s; }
.urow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.details .urow input[type=text] { flex: 1 1 auto; width: auto; min-width: 0; }
.urow.ok input[type=text] { text-decoration: line-through; color: var(--muted); }
.uhaken { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #c4c1e8; background: #fff; padding: 0; display: grid; place-items: center; flex: none; color: #fff; transition: all .15s; }

      s = s.replace(/^[\s,;:\-–—]+/, "").replace(/[\s,;:\-–—]+$/, "").replace(/\s+(am|bis|für|ab|zum|spätestens|und)$/i, "");
    } while (s !== vorher);
  }
  if (!s.length) { s = orig; erg.erkannt = false; erg.plan = erg.deadline = erg.quelle = ""; erg.wichtig = erg.dringend = false; }
  erg.titel = s.charAt(0).toUpperCase() + s.slice(1);
  return erg;
}

/* Dauer aus Text: 45 · 45min · 1,5h · 1h30 · 1:30 · 2 std (Dezimalzahl ohne Einheit = Stunden). Ergebnis in Minuten, 0 = nicht erkannt */
function parseDauer(t) {
  t = String(t || "").trim().toLowerCase().replace(/\s+/g, "");
  var m, r = 0;
  if ((m = /^(\d{1,2}):(\d{2})$/.exec(t))) r = (+m[1]) * 60 + (+m[2]);
  else if ((m = /^(\d+)(?:h|std|stunden?)(\d{1,2})(?:m|min)?$/.exec(t))) r = (+m[1]) * 60 + (+m[2]);
  else if ((m = /^(\d+(?:[.,]\d+)?)(?:h|std|stunden?)$/.exec(t))) r = Math.round(parseFloat(m[1].replace(",", ".")) * 60);
  else if ((m = /^(\d+)(?:m|min|minuten?)$/.exec(t))) r = +m[1];
  else if ((m = /^(\d+)$/.exec(t))) r = +m[1];
  else if ((m = /^(\d+[.,]\d+)$/.exec(t))) r = Math.round(parseFloat(m[1].replace(",", ".")) * 60);
  return r > 0 && r <= 1440 ? r : 0;
}
/* Zerlegt die Eingabe: Mandant (m:), Projekt (p:), Unteraufgaben ("Titel: a; b") und danach Datum/Kürzel */
function zerlege(text, h, roh) {
  var t = (text || "").trim();
  var nix = { titel: t, plan: "", deadline: "", wichtig: false, dringend: false, quelle: "", mandant: "", projekt: "", unter: [], zeit: 0, erkannt: false };
  if (roh || !t) return nix;
  var mandant = "", projekt = "", unter = [], zeit = 0, s = t;
  s = s.replace(/(^|\s)(mandant|projekt|m|p):(?:"([^"]+)"|(\S+))/giu, function (alles, v, k, q, w) {
    var val = (q || w || "").trim(), rest = "";
    if (!q && /:$/.test(val)) { val = val.slice(0, -1); rest = ":"; }
    if (!val) return alles;
    if (/^m/i.test(k)) mandant = val; else projekt = val;
    return v + rest;
  });
  s = s.replace(/(^|\s)z:(\S+)/giu, function (alles, v, w) {
    var rest = ""; if (/:$/.test(w)) { w = w.slice(0, -1); rest = ":"; }
    var m = parseDauer(w); if (!m) return alles; zeit = m; return v + rest;
  });
  var sp = /^([^:;]+?):\s+([\s\S]*;[\s\S]*)$/.exec(s);
  if (sp && !/(?:^|\s)(?:bis|spätestens|deadline|frist|fällig|dl|am|an|für|ab|zum|plan|geplant)$/i.test(sp[1].trim())) {
    unter = sp[2].split(";").map(function (x) { return x.trim(); }).filter(Boolean);
    if (unter.length) s = sp[1];
  }
  s = s.replace(/\s+/g, " ").trim();
  if (!s.replace(/[\s:;]+/g, "")) return nix;
  var p = parseEingabe(s, h);
  p.mandant = mandant; p.projekt = projekt; p.unter = unter; p.zeit = zeit;
  p.erkannt = !!(p.erkannt || mandant || projekt || unter.length || zeit);
  return p;
}
/*PARSER_END*/
</script>

        var j;
        try { j = JSON.parse(await (await h.getFile()).text()); } catch (x) { continue; }
        if (!j || !j.gesichert || !Array.isArray(j.aufgaben)) continue;
        alle.push({ name: name, stamp: j.gesichert });
        if (j.gesichert <= (meta.iphoneStand || "")) continue;
        if (!best || j.gesichert > best.stamp) best = { name: name, handle: h, stamp: j.gesichert, anzahl: j.aufgaben.length, basis: j.basis || "" };
      }
    } catch (err) { return; }
    datei.iphone = best; datei.iphoneAlle = alle; renderKopf();
  }
  function iphoneLaden() {
    var ip = datei.iphone; if (!ip) return;
    ip.handle.getFile().then(function (f) { return f.text(); }).then(function (t) {
      var d = JSON.parse(t), neu = d.aufgaben;
      if (!Array.isArray(neu)) throw new Error("Falsches Format");
      var sauber = ip.basis && ip.basis === meta.dateiStand;
      var frage = sauber
        ? "Der Stand vom iPhone (" + neu.length + " Aufgaben, " + zeitText(ip.stamp) + ") ersetzt den Stand auf diesem PC (" + aufgaben.length + " Aufgaben). Der PC hat seit dem Abgleich mit dem iPhone nichts Eigenes gespeichert. Fortfahren?"
        : "ACHTUNG: Die iPhone-Datei (" + neu.length + " Aufgaben, " + zeitText(ip.stamp) + ") baut nicht auf dem letzten Stand dieses PCs auf. Änderungen, die du hier seit dem letzten Abgleich gemacht hast, gehen verloren (aktuell " + aufgaben.length + " Aufgaben). Fortfahren?";
      if (!confirm(frage)) return;
      aufgaben = neu.map(norm);
      if (Array.isArray(d.papierkorb)) papierkorb = d.papierkorb.map(function (e) { return { a: norm(e.a || e), am: e.am || "" }; });
      zeitenUebernehmen(d);
      meta.iphoneStand = ip.stamp; datei.iphone = null; ui.offenId = null; ui.anim = true;
      speichern(); render(); toast(aufgaben.length + " Aufgaben vom iPhone geladen.");
      setTimeout(function () { iphoneAufraeumen(ip.stamp); }, 150);
    }).catch(function (err) { alert("Die iPhone-Datei konnte nicht gelesen werden: " + (err && err.message ? err.message : err)); });
  }
  function iphoneAufraeumen(stamp) {
    var weg = (datei.iphoneAlle || []).filter(function (x) { return x.stamp <= stamp; });
    if (!weg.length || !datei.dir) return;
    var namen = weg.slice(0, 6).map(function (x) { return "- " + x.name; }).join("\n") + (weg.length > 6 ? "\n- … und " + (weg.length - 6) + " weitere" : "");
    if (!confirm("Aufräumen: Die geladene iPhone-Sicherung und ältere (" + weg.length + " Datei" + (weg.length === 1 ? "" : "en") + ") aus dem Ordner \"" + datei.dir.name + "\" löschen?\n\n" + namen +
      "\n\nGelöscht werden nur Dateien, die mit \"aufgaben-iphone-\" beginnen. " + DFILE + " bleibt erhalten. Das lässt sich nicht rückgängig machen.")) return;
    Promise.all(weg.map(function (x) { return datei.dir.removeEntry(x.name).then(function () { return null; }, function (err) { return x.name + ": " + (err && err.message ? err.message : err); }); })).then(function (fehler) {
      fehler = fehler.filter(Boolean);
      datei.iphoneAlle = (datei.iphoneAlle || []).filter(function (x) { return x.stamp > stamp; });
      toast(fehler.length ? "Nicht alles gelöscht: " + fehler[0] : (weg.length === 1 ? "1 Datei gelöscht." : weg.length + " Dateien gelöscht."));
    });
  }
  function iphoneIgnorieren() {
    if (!datei.iphone) return;
    meta.iphoneStand = datei.iphone.stamp; datei.iphone = null; speichern(); renderKopf();
  }
  function dateiVerknuepfen() {
    window.showDirectoryPicker({ id: "aufgaben", mode: "readwrite" }).then(function (dir) {
      datei.dir = dir; datei.status = "bereit"; datei.frisch = false; meta.dateiStand = "";
      return idb(function (st) { return st.put(dir, "ordner"); }).then(dateiSchreiben).then(function () {
        if (datei.status === "bereit") toast("Verknüpft. Jede Änderung wird jetzt automatisch in " + DFILE + " im Ordner \"" + dir.name + "\" gespeichert.");
        return iphoneSuchen();
      });
    }, function (err) { if (!err || err.name !== "AbortError") toast("Der Ordner konnte nicht gewählt werden: " + (err && err.message ? err.message : err)); });
  }
  function dateiFortsetzen() {
    if (!datei.dir) return;
    datei.dir.requestPermission({ mode: "readwrite" }).then(function (p) {
      if (p !== "granted") { toast("Ohne Freigabe kann nicht in den Ordner gespeichert werden."); return; }
      datei.status = "bereit";
      return dateiPruefen().then(function (r) {
        if (r === "konflikt") { datei.status = "konflikt"; renderKopf(); toast("Die Datei im Ordner hat einen anderen Stand. Wähle \"Aus Datei laden\" oder \"Datei überschreiben\"."); }
        else { renderKopf(); dateiPlanen(); }
        return iphoneSuchen();
      });
    }).catch(function (err) { toast("Freigabe nicht möglich: " + (err && err.message ? err.message : err)); });
  }
  function dateiLaden() {
    if (!datei.dir) return;
    masterDatei().then(function (f) { if (!f) throw new Error("Die Datei " + DFILE + " liegt nicht mehr im Ordner."); return f.text(); }).then(function (t) {
      var d = JSON.parse(t), neu = Array.isArray(d) ? d : d.aufgaben;
      if (!Array.isArray(neu)) throw new Error("Falsches Format");
      if (!confirm("Das ersetzt alle aktuellen Aufgaben (" + aufgaben.length + ") auf diesem PC durch " + neu.length + " Aufgaben aus der Datei. Fortfahren?")) return;
      aufgaben = neu.map(norm);
      if (!Array.isArray(d) && Array.isArray(d.papierkorb)) papierkorb = d.papierkorb.map(function (e) { return { a: norm(e.a || e), am: e.am || "" }; });
      zeitenUebernehmen(d);
      meta.dateiStand = d.gesichert || ""; datei.status = "bereit"; ui.offenId = null; ui.anim = true;
      speichern(); render(); toast(aufgaben.length + " Aufgaben aus der Datei geladen.");
    }).catch(function (err) { alert("Die Datei konnte nicht gelesen werden: " + (err && err.message ? err.message : err)); });
  }
  function dateiUeberschreiben() {
    if (!confirm("Die Datei im Ordner wird mit dem Stand dieses PCs überschrieben. Änderungen in der Datei, die hier fehlen, gehen verloren. Fortfahren?")) return;
    datei.status = "bereit"; datei.frisch = true;
    dateiSchreiben();
  }
  function dateiLoesen() {
    datei.dir = null; datei.status = "aus"; datei.zeit = null; datei.iphone = null; clearTimeout(dTimer);
    idb(function (st) { return st.delete("ordner"); }).catch(function () {});
    renderKopf(); toast("Verknüpfung gelöst. Die Dateien im Ordner bleiben unverändert.");
  }
  function dateiInit() {
    if (!FSA) return;
    idb(function (st) { return st.get("ordner"); }).then(function (dir) {
      if (!dir) return;
      datei.dir = dir;
      return dir.queryPermission({ mode: "readwrite" }).then(function (p) {
        if (p !== "granted") { datei.status = "erlaubnis"; renderKopf(); return; }
        datei.status = "bereit";
        return dateiPruefen().then(function (r) { if (r === "konflikt") datei.status = "konflikt"; renderKopf(); return iphoneSuchen(); });
      });
    }).catch(function () {});
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden" && dTimer) dateiSchreiben();
      if (document.visibilityState === "visible") iphoneSuchen();
    });
  }
  function sichernMitDialog() {
    var opt = { suggestedName: "aufgaben-sicherung-" + heute() + ".json", id: "aufgaben-sicherung", types: [{ description: "Aufgaben (JSON)", accept: { "application/json": [".json"] } }] };
    if (datei.dir) opt.startIn = datei.dir;
    window.showSaveFilePicker(opt).then(function (h) {
      return h.createWritable().then(function (w) { return w.write(sicherungText()).then(function () { return w.close(); }); }).then(function () {
        meta.letzteSicherung = heute(); speichern(); renderKopf(); toast("Sicherung gespeichert: " + h.name);
      });
    }, function (err) { if (!err || err.name !== "AbortError") toast("Sichern ist nicht möglich: " + (err && err.message ? err.message : err)); });
  }

  /* ---------- Sichern und Wiederherstellen ---------- */
  function ausgeben(name, mime, text, meldung) {
    var blob = new Blob([text], { type: mime }), datei = null;
    try { datei = new File([blob], name, { type: mime.split(";")[0] }); } catch (e) {}
    if (datei && navigator.canShare && navigator.canShare({ files: [datei] })) {
      navigator.share({ files: [datei] }).then(function () { toast(meldung); }, function () {});
      return;
    }
    var l = document.createElement("a");
    l.href = URL.createObjectURL(blob); l.download = name;
    document.body.appendChild(l); l.click(); document.body.removeChild(l);
    setTimeout(function () { URL.revokeObjectURL(l.href); }, 1000);
    toast(meldung);
  }

  function sichern() {
    if (typeof window.showSaveFilePicker === "function") { sichernMitDialog(); return; }
    meta.letzteSicherung = heute(); speichern();
    var blob = new Blob([sicherungText()], { type: "application/json" });
    var jetzt = new Date(), name = "aufgaben-iphone-" + heute() + "-" + p2(jetzt.getHours()) + p2(jetzt.getMinutes()) + ".json";
    renderKopf();
    var datei = null;
    try { datei = new File([blob], name, { type: "application/json" }); } catch (e) {}
    if (datei && navigator.canShare && navigator.canShare({ files: [datei] })) {
      navigator.share({ files: [datei] }).then(function () { toast("Sicherung weitergegeben. Speichere sie in \"Dateien\" im DRACOON-Ordner. Am PC dann \"Wiederherstellen\" und diese Datei wählen."); }, function () {});
      return;
    }
    var l = document.createElement("a");
    l.href = URL.createObjectURL(blob); l.download = name;
    document.body.appendChild(l); l.click(); document.body.removeChild(l);
    setTimeout(function () { URL.revokeObjectURL(l.href); }, 1000);
    toast("Sicherung erzeugt. Lege die Datei in deinem sicheren Ordner ab.");
  }
  var dat_ = document.createElement("input");
  dat_.type = "file"; dat_.id = "datei"; dat_.style.display = "none";
  document.body.appendChild(dat_);
  dat_.addEventListener("change", function () {
    var f = dat_.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result), neu = Array.isArray(d) ? d : d.aufgaben;
        if (!Array.isArray(neu)) throw new Error("Falsches Format");
        if (!confirm("Wiederherstellen ersetzt alle aktuellen Aufgaben (" + aufgaben.length + ") durch " + neu.length + " Aufgaben aus der Datei. Fortfahren?")) { dat_.value = ""; return; }
        aufgaben = neu.map(norm); meta.basis = (!Array.isArray(d) && d.gesichert) || "";
        if (!Array.isArray(d) && Array.isArray(d.papierkorb)) papierkorb = d.papierkorb.map(function (e) { return { a: norm(e.a || e), am: e.am || "" }; });
      zeitenUebernehmen(d);
        ui.offenId = null; speichern(); ui.anim = true; render(); toast(aufgaben.length + " Aufgaben wiederhergestellt.");
      } catch (err) { alert("Die Datei konnte nicht gelesen werden: " + err.message); }
      dat_.value = "";
    };
    r.readAsText(f);
  });

  dateiInit();
  setInterval(function () { var z = $("lz"); if (z && meta.timer) z.textContent = hms(Math.max(0, Math.round((Date.now() - new Date(meta.timer.start).getTime()) / 1000))); }, 1000);
  vorschau(); render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
  try {
    var istIos = /iphone|ipad|ipod/i.test(navigator.userAgent), standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
    if (istIos && !standalone && !localStorage.getItem("installhinweis_zu")) $("installhinweis").classList.add("sicht");
    $("installzu").addEventListener("click", function () { $("installhinweis").classList.remove("sicht"); try { localStorage.setItem("installhinweis_zu", "1"); } catch (e) {} });
  } catch (e) {}
  setInterval(function () { if (document.visibilityState === "visible" && !document.activeElement.matches("input,textarea,select")) { renderKopf(); } }, 60000);
})();
</script>
</body>
